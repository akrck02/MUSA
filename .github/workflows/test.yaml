# Checks every push and pull request: the formatter, the linter and the tests. MUSA builds against
# checkouts of Go UI, Go Renderer and Bubble beside it (see go.mod), so they are checked out too,
# at the commits MUSA is built with: a push to those branches never turns MUSA red by itself. Move
# a commit here when MUSA starts using something newer, in the same pull request.
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MUSA
      - uses: actions/checkout@v4
        with:
          repository: akrck02/go-ui
          ref: d75b8bfb80111e3608c4ba018b8e2a1a477e5612 # feature/stacked
          path: go-ui
      - uses: actions/checkout@v4
        with:
          repository: akrck02/go-renderer
          ref: e529f421f7c6bd10426fc34dcdea02ce2a3120d2 # feature/system-fonts
          path: go-renderer
      - uses: actions/checkout@v4
        with:
          repository: akrck02/bubble
          ref: b4c18caa0af42b7f9fceb81817c72f4d83fb476d # feature/v4
          path: bubble
      - uses: actions/setup-go@v5
        with:
          go-version-file: MUSA/go.mod
      - name: OpenGL's and X11's headers, which the window builds against
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Formatted
        working-directory: MUSA
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        working-directory: MUSA
        run: go vet -tags=x11 ./...
      - name: Test
        working-directory: MUSA
        run: go test -tags=x11 ./...
      - name: The reference matches the code
        working-directory: MUSA
        run: python3 docs/5-reference/generate.py && git diff --exit-code docs/5-reference
